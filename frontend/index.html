<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikro-Öğrenme: Çalışma Ekranı</title>

    <link rel="icon" type="image/jpeg" href="mindloop.jpeg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<header class="bg-white shadow-sm border-b border-gray-100 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-900 flex items-center gap-2">
            <i class="fa-solid fa-brain"></i> Spaced Repetition
        </h1>
        
        <a href="upload.html" 
           class="px-5 py-2.5 bg-indigo-50 text-blue-900 font-bold text-sm rounded-lg hover:bg-indigo-100 transition duration-200 border border-indigo-100 flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> İçerik Yükle
        </a>
    </div>
</header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 overflow-hidden relative">

        <div class="w-full max-w-lg relative">

           <div id="messageBox"
    class="hidden bg-white p-10 rounded-2xl shadow-2xl text-center w-full min-h-[420px] flex-col justify-center items-center border-t-[6px] border-blue-900">
    
    <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-layer-group text-5xl text-blue-900 animate-bounce"></i>
    </div>
    
    <h2 class="text-3xl font-extrabold text-gray-800 mb-3">Bugünlük Bu Kadar! 🎉</h2>
    
    <p class="text-gray-600 text-lg font-medium max-w-md mx-auto">
        Günlük hedefini başarıyla tamamladın veya henüz sisteme çalışılacak bir içerik yüklemedin.
    </p>

    <p class="text-yellow-400 text-sm mt-8">
        Yeni kartlar eklemek için sağ üstteki butonu kullanabilirsin.
    </p>
</div>

            <div class="flip-card-container h-[420px] w-full cursor-pointer" id="cardContainer">
                <div class="flip-card-inner" id="flipCardInner">

                    <div class="flip-card-front bg-white flex flex-col justify-between items-center p-8 border-t-[6px] border-sky-700">
                        <div class="w-full flex justify-between items-center border-b border-gray-100 pb-4">
                            <span class="text-xs font-bold tracking-wider text-blue-900 uppercase">Soru Kartı</span>
                            <span class="px-3 py-1 bg-yellow-400 text-gray-100 text-xs font-bold rounded-full"
                                id="cardCategory">Konu</span>
                        </div>

                        <div class="flex-grow flex items-center justify-center py-4">
                            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 text-center leading-tight"
                                id="cardQuestion">
                                Yükleniyor...
                            </h2>
                        </div>

                        <div class="text-center text-gray-600 text-sm flex flex-col items-center gap-2">
                            <i class="fa-regular fa-hand-pointer animate-bounce"></i>
                            Cevabı görmek için dokun
                        </div>
                    </div>

                    <div class="flip-card-back flex flex-col justify-center items-center p-8 text-white relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <i class="fa-solid fa-lightbulb text-9xl"></i>
                        </div>

                        <p class="text-xs font-bold text-indigo-200 tracking-[0.2em] uppercase mb-6 relative z-10">DOĞRU
                            CEVAP</p>

                        <div class="text-2xl md:text-3xl font-bold text-center relative z-10 leading-snug"
                            id="cardAnswer">
                            ...
                        </div>
                    </div>

                </div>
            </div>

            <div id="actionButtons"
                class="mt-8 flex justify-center gap-3 invisible opacity-0 transition-all duration-500 transform translate-y-4">

                <button id="markEasy" onclick="window.submitAnswer('EASY')"
                    class="flex-1 py-3 bg-slate-700 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:shadow-emerald-200 flex flex-col items-center justify-center gap-1">
                    <span class="text-lg">Kolay</span>
                    <span class="text-[10px] opacity-80 font-normal">Uzun süre sonra</span>
                </button>

                <button id="markMedium" onclick="window.submitAnswer('MEDIUM')"
                    class="flex-1 py-3 bg-gray-800 hover:bg-amber-600 text-white font-bold rounded-xl shadow-lg hover:shadow-amber-200 flex flex-col items-center justify-center gap-1">
                    <span class="text-lg">Orta</span>
                    <span class="text-[10px] opacity-80 font-normal">Yakın Zamanda</span>
                </button>

                <button id="markHard" onclick="window.submitAnswer('HARD')"
                    class="flex-1 py-3 bg-zinc-900 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg hover:shadow-rose-200 flex flex-col items-center justify-center gap-1">
                    <span class="text-lg">Zor</span>
                    <span class="text-[10px] opacity-80 font-normal">Şimdi Tekrar</span>
                </button>
            </div>

        </div>
    </main>

    <script src="app.js"></script>

    <div id="toastNotification"
        class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-[100] flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
        <i class="fa-solid fa-calendar-check text-green-400"></i>
        <span id="toastText" class="font-medium text-sm">...</span>
    </div>

</body>

</html>
